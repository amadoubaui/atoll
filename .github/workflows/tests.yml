# Essais d'Atoll sur macOS et Windows à chaque envoi.
# Sous Windows, l'application est aussi fabriquée et publiée comme pièce jointe.
name: Tests

on:
  push:
  workflow_dispatch:

jobs:
  tests:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Écran en 1920 × 1080 (Windows)
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: Set-DisplayResolution -Width 1920 -Height 1080 -Force

      # L'écran des machines macOS de GitHub fait 1024 × 768 : la fenêtre d'essai doit y tenir.
      - name: Essais de bout en bout
        run: node scripts/test-ui.js
        env:
          ATOLL_TEST_SIZE: ${{ runner.os == 'macOS' && '1000x680' || '1440x900' }}

      - name: Fabrication (Windows)
        if: runner.os == 'Windows'
        run: node scripts/build-win.js --icon

      - name: Version
        if: runner.os == 'Windows'
        shell: bash
        run: echo "ATOLL_VERSION=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v5
        if: runner.os == 'Windows'
        with:
          name: Atoll-${{ env.ATOLL_VERSION }}-windows-x64
          path: ~/.atoll-dev/dist/Atoll-*-windows-*.zip
